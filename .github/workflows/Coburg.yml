name: Generate pmbootstrap Config

on:
  workflow_dispatch:

jobs:
  generate-config:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            openssl \
            python3-venv \
            kpartx \
            e2fsprogs \
            dosfstools \
            rsync \
            util-linux \
            mount \
            parted \
            btrfs-progs \
            xz-utils \
            gzip \
            tar

      - name: Install pmbootstrap
        run: |
          python -m pip install --upgrade pip

          python -m pip install --user \
            "git+https://gitlab.postmarketOS.org/postmarketOS/pmbootstrap.git"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.local/bin:$PATH"

          pmbootstrap --version

      - name: Prepare pmbootstrap directories
        run: |
          mkdir -p "$HOME/.config"
          mkdir -p "$HOME/.local/var/pmbootstrap/cache_git"

      - name: Clone pmaports
        run: |
          APORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"

          if [ ! -d "$APORTS/.git" ]; then
            git clone \
              --depth=1 \
              https://gitlab.postmarketOS.org/postmarketOS/pmaports.git \
              "$APORTS"
          fi

          echo "pmaports:"
          du -sh "$APORTS"

      - name: Generate pmbootstrap_v3.cfg
        run: |
          CONFIG="$HOME/.config/pmbootstrap_v3.cfg"
          WORK="$HOME/.local/var/pmbootstrap"
          APORTS="$WORK/cache_git/pmaports"

          cat > "$CONFIG" <<EOF
          [pmbootstrap]
          work = $WORK
          aports = $APORTS
          device = samsung-smt500
          ui = phosh
          hostname = slim-os
          jobs = 4
          is_default_channel = true
          build_default_device_arch = true
          EOF

          echo "================================"
          echo "GENERATED CONFIG"
          echo "================================"

          cat "$CONFIG"

      - name: Validate config file
        run: |
          CONFIG="$HOME/.config/pmbootstrap_v3.cfg"

          test -f "$CONFIG"

          echo "Config exists:"
          ls -lh "$CONFIG"

          echo
          echo "Config content:"
          cat "$CONFIG"

      - name: Validate configuration with pmbootstrap
        run: |
          CONFIG="$HOME/.config/pmbootstrap_v3.cfg"

          pmbootstrap \
            -c "$CONFIG" \
            status

      - name: Validate pmaports
        run: |
          APORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"

          test -d "$APORTS"
          test -d "$APORTS/.git"

          echo "pmaports repository:"
          git -C "$APORTS" remote -v

          echo
          echo "pmaports commit:"
          git -C "$APORTS" rev-parse HEAD

      - name: Validate Samsung SM-T500
        run: |
          CONFIG="$HOME/.config/pmbootstrap_v3.cfg"

          echo "Checking device with pmbootstrap..."

          pmbootstrap \
            -c "$CONFIG" \
            deviceinfo_parse \
            samsung-smt500

      - name: Final status
        run: |
          CONFIG="$HOME/.config/pmbootstrap_v3.cfg"

          echo
          echo "================================"
          echo "FINAL PMBOOTSTRAP STATUS"
          echo "================================"

          pmbootstrap \
            -c "$CONFIG" \
            status

      - name: Prepare artifact
        run: |
          mkdir -p build-output

          cp \
            "$HOME/.config/pmbootstrap_v3.cfg" \
            build-output/pmbootstrap_v3.cfg

          echo "Artifact:"
          cat build-output/pmbootstrap_v3.cfg

      - name: Upload configuration
        uses: actions/upload-artifact@v4
        with:
          name: pmbootstrap-smt500-config
          path: build-output/pmbootstrap_v3.cfg
          if-no-files-found: error
