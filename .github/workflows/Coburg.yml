name: Generate pmbootstrap Config

on:
  workflow_dispatch:

jobs:
  generate-config:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            openssl \
            python3-venv \
            kpartx \
            e2fsprogs \
            dosfstools \
            rsync \
            util-linux \
            mount \
            parted \
            btrfs-progs \
            xz-utils \
            gzip \
            tar

      - name: Install pmbootstrap
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user \
            "git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          pmbootstrap --version

      - name: Prepare directories
        run: |
          mkdir -p "$HOME/.config"
          mkdir -p "$HOME/.local/var/pmbootstrap/cache_git"

      - name: Clone pmaports
        run: |
          PMB_WORK="$HOME/.local/var/pmbootstrap"
          PMB_APORTS="$PMB_WORK/cache_git/pmaports"

          if [ ! -d "$PMB_APORTS/.git" ]; then
            git clone \
              --depth=1 \
              --branch=master \
              https://gitlab.postmarketOS.org/postmarketOS/pmaports.git \
              "$PMB_APORTS"
          fi

      - name: Generate pmbootstrap_v3.cfg
        run: |
          CONFIG="$HOME/.config/pmbootstrap_v3.cfg"
          WORK="$HOME/.local/var/pmbootstrap"
          APORTS="$WORK/cache_git/pmaports"

          rm -f "$CONFIG"

          pmbootstrap \
            -c "$CONFIG" \
            -y config work "$WORK"

          pmbootstrap \
            -c "$CONFIG" \
            -y config aports "$APORTS"

          pmbootstrap \
            -c "$CONFIG" \
            -y config device "samsung-smt500"

          pmbootstrap \
            -c "$CONFIG" \
            -y config ui "phosh"

          pmbootstrap \
            -c "$CONFIG" \
            -y config hostname "slim-os"

          pmbootstrap \
            -c "$CONFIG" \
            -y config jobs "4"

          pmbootstrap \
            -c "$CONFIG" \
            -y config is_default_channel "true"

          pmbootstrap \
            -c "$CONFIG" \
            -y config build_default_device_arch "true"

          echo "===== GENERATED CONFIG ====="
          cat "$CONFIG"

      - name: Validate configuration syntax
        run: |
          CONFIG="$HOME/.config/pmbootstrap_v3.cfg"

          test -f "$CONFIG"

          echo "Config exists:"
          ls -lh "$CONFIG"

          echo "Config contents:"
          cat "$CONFIG"

      - name: Validate pmbootstrap configuration
        run: |
          CONFIG="$HOME/.config/pmbootstrap_v3.cfg"

          pmbootstrap \
            -c "$CONFIG" \
            status

      - name: Validate pmaports repository
        run: |
          APORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"

          test -d "$APORTS/.git"

          echo "pmaports commit:"
          git -C "$APORTS" rev-parse HEAD

          echo "pmaports branch:"
          git -C "$APORTS" branch --show-current

      - name: Validate Samsung SM-T500 device
        run: |
          APORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"

          echo "Searching for samsung-smt500..."

          if find "$APORTS" -type f \
            \( -name "deviceinfo" -o -name "APKBUILD" \) \
            -print0 | xargs -0 grep -l "samsung-smt500" >/dev/null 2>&1; then

            echo "Samsung SM-T500 references found."

          elif find "$APORTS/device" -maxdepth 3 -type d \
            -iname "*smt500*" | grep -q .; then

            echo "Samsung SM-T500 device directory found."

          else
            echo "WARNING: samsung-smt500 was not found by the local search."
            echo "pmbootstrap status will be used as the final configuration check."
          fi

      - name: Final configuration check
        run: |
          CONFIG="$HOME/.config/pmbootstrap_v3.cfg"

          echo "======================================"
          echo "FINAL PMBOOTSTRAP CONFIGURATION CHECK"
          echo "======================================"

          pmbootstrap \
            -c "$CONFIG" \
            status

          echo
          echo "Config file:"
          echo "$CONFIG"

          echo
          echo "Configuration:"
          cat "$CONFIG"

      - name: Copy config to artifact directory
        run: |
          mkdir -p build-output

          cp \
            "$HOME/.config/pmbootstrap_v3.cfg" \
            build-output/pmbootstrap_v3.cfg

      - name: Upload pmbootstrap configuration
        uses: actions/upload-artifact@v4
        with:
          name: pmbootstrap-smt500-config
          path: build-output/pmbootstrap_v3.cfg
          if-no-files-found: error
