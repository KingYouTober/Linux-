name: Build postmarketOS Image

on:
  workflow_dispatch:

jobs:
  build-os-image:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openssl systemd-container python3-venv

      - name: Install pmbootstrap from official git
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user "git+https://postmarketos.org"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Update pmaports
        run: |
          # 'pull' erstellt das fehlende pmaports-Repository automatisch im Arbeitsverzeichnis
          pmbootstrap -c ".github/Con.ini" pull

      - name: Verify pmbootstrap Status
        run: |
          # Jetzt, da das Repository existiert, läuft der Status-Check fehlerfrei durch
          pmbootstrap -c ".github/Con.ini" status

      - name: Build rootfs and system image
        run: |
          pmbootstrap -c ".github/Con.ini" -y install \
            --password "github" \
            --no-sshd \
            --no-firewall

      - name: Export OS image artifacts
        run: |
          mkdir -p build-output
          pmbootstrap -c ".github/Con.ini" export build-output

      - name: Upload compiled OS artifact
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-smt500-phosh
          path: build-output/**
