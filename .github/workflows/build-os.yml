---
name: Build postmarketOS Image

on:
  workflow_dispatch:

jobs:
  build-os-image:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openssl systemd-container

      - name: Install pmbootstrap via git
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$HOME/pmbootstrap"
          mkdir -p ~/.local/bin
          ln -s "$HOME/pmbootstrap/pmbootstrap.py" ~/.local/bin/pmbootstrap
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify pmbootstrap version
        run: pmbootstrap --version

      - name: Initialize pmbootstrap
        run: |
          mkdir -p ~/.config
          cp .github/Con.ini ~/.config/pmbootstrap_v3.cfg
          yes '' | pmbootstrap --details-to-stdout init

      - name: Build rootfs and system image
        run: |
          pmbootstrap -y install \
            --password "github" \
            --no-sshd \
            --no-firewall

      - name: Export OS image artifacts
        run: |
          mkdir -p build-output
          pmbootstrap export build-output

      - name: Upload compiled OS artifact
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-smt500-phosh
          path: build-output/**
