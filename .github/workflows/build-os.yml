name: Build postmarketOS Image

on:
  workflow_dispatch:

jobs:
  build-os-image:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openssl systemd-container python3-venv

      - name: Install pmbootstrap from official git
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user "git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: Configure pmbootstrap
        run: |
          CONFIG_FILE="$HOME/.config/pmbootstrap_v3.cfg"
          mkdir -p "$HOME/.config"

          pmbootstrap -c "$CONFIG_FILE" -y config work "$HOME/.local/var/pmbootstrap"
          pmbootstrap -c "$CONFIG_FILE" -y config device "samsung-smt500"
          pmbootstrap -c "$CONFIG_FILE" -y config ui "phosh"
          pmbootstrap -c "$CONFIG_FILE" -y config hostname "slim-os"
          pmbootstrap -c "$CONFIG_FILE" -y config jobs "4"
          pmbootstrap -c "$CONFIG_FILE" -y config build_default_device_arch "true"
          pmbootstrap -c "$CONFIG_FILE" -y config is_default_channel "true"
          pmbootstrap -c "$CONFIG_FILE" -y status

      - name: Update pmaports
        run: |
          CONFIG_FILE="$HOME/.config/pmbootstrap_v3.cfg"
          pmbootstrap -c "$CONFIG_FILE" -y pull

      - name: Build rootfs and system image
        run: |
          CONFIG_FILE="$HOME/.config/pmbootstrap_v3.cfg"
          pmbootstrap -c "$CONFIG_FILE" -y install \
            --password "github" \
            --no-sshd \
            --no-firewall

      - name: Export OS image artifacts
        run: |
          CONFIG_FILE="$HOME/.config/pmbootstrap_v3.cfg"
          mkdir -p build-output
          pmbootstrap -c "$CONFIG_FILE" -y export build-output

      - name: Upload compiled OS artifact
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-smt500-phosh
          path: build-output/**
