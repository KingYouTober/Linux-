name: Build postmarketOS Image

on:
  workflow_dispatch:

jobs:
  build-os-image:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openssl systemd-container python3-venv

      - name: Install pmbootstrap from official git
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user "git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify and Status pmbootstrap Config
        run: |
          # Wir weisen pmbootstrap an, direkt deine Datei aus dem Repository zu nutzen
          pmbootstrap -c ".github/Con.ini" status

      - name: Update pmaports
        run: |
          pmbootstrap -c ".github/Con.ini" pull

      - name: Build rootfs and system image
        run: |
          pmbootstrap -c ".github/Con.ini" -y install \
            --password "github" \
            --no-sshd \
            --no-firewall

      - name: Export OS image artifacts
        run: |
          mkdir -p build-output
          pmbootstrap -c ".github/Con.ini" export build-output

      - name: Upload compiled OS artifact
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-smt500-phosh
          path: build-output/**
