name: Build postmarketOS Image

on:
  workflow_dispatch:

jobs:
  build-os-image:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openssl systemd-container python3-venv

      - name: Install pmbootstrap from git
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user "git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/pmbootstrap" --version

      - name: Initialize pmbootstrap for SM-T500
        run: |
          pmbootstrap init \
            --work ~/.local/var/pmbootstrap \
            --aports ~/.local/var/pmbootstrap/cache_git/aports \
            --arch arm64 \
            --device samsung-smt500 \
            --ui phosh \
            --hostname slim-os \
            --channel edge \
            --non-interactive

      - name: Inject custom GTK configurations
        run: |
          mkdir -p ~/.local/var/pmbootstrap/chroot_rootfs-samsung-smt500/etc/phosh
          if [ -f configs/phosh.css ]; then
            cp configs/phosh.css ~/.local/var/pmbootstrap/chroot_rootfs-samsung-smt500/etc/phosh/phosh.css
          fi

      - name: Build rootfs and system image
        run: |
          pmbootstrap install --ondev --no-fsi

      - name: Export OS image artifacts
        run: |
          mkdir -p build-output
          pmbootstrap export build-output/

      - name: Upload compiled OS artifact
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-smt500-phosh
          path: build-output/**
